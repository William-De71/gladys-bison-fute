<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Bison Futé integration for Gladys Assistant (illustration,
       not the logo of Bison Futé). A road at dusk, a warning sign and the four
       colors of the traffic forecast. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="0.55" stop-color="#3a4d7a"/>
      <stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5a3a"/>
      <stop offset="1" stop-color="#173322"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f5c"/>
      <stop offset="1" stop-color="#22252d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <circle cx="400" cy="250" r="160" fill="url(#sun)"/>

  <!-- hills -->
  <path d="M0 260 C 140 220, 260 250, 400 240 C 540 230, 660 210, 800 250 L800 534 L0 534 Z" fill="url(#ground)"/>
  <path d="M0 300 C 160 280, 300 300, 400 296 C 520 292, 650 275, 800 300 L800 534 L0 534 Z" fill="#1d3f2a" opacity="0.7"/>

  <!-- road in perspective -->
  <path d="M385 240 L415 240 L640 534 L160 534 Z" fill="url(#road)"/>
  <path d="M385 240 L160 534 L176 534 L389 240 Z" fill="#e8e8e8" opacity="0.85"/>
  <path d="M415 240 L640 534 L624 534 L411 240 Z" fill="#e8e8e8" opacity="0.85"/>
  <g fill="#f4f4f4">
    <path d="M399 252 L401 252 L402 268 L398 268 Z"/>
    <path d="M397 290 L403 290 L405 318 L395 318 Z"/>
    <path d="M394 350 L406 350 L409 395 L391 395 Z"/>
  </g>

  <!-- car lights far away -->
  <g>
    <circle cx="404" cy="262" r="2.6" fill="#ff5a4f"/>
    <circle cx="410" cy="262" r="2.6" fill="#ff5a4f"/>
  </g>

  <!-- warning sign -->
  <g transform="translate(600 120)">
    <rect x="-5" y="70" width="10" height="190" fill="#9aa1ad"/>
    <path d="M0 -10 L78 120 L-78 120 Z" fill="#ffffff" stroke="#d62828" stroke-width="14" stroke-linejoin="round"/>
    <rect x="-6" y="30" width="12" height="50" rx="5" fill="#1b1b1b"/>
    <circle cx="0" cy="96" r="8" fill="#1b1b1b"/>
  </g>

  <!-- forecast colors: green, orange, red, black -->
  <g transform="translate(70 92)">
    <rect x="-18" y="-18" width="236" height="78" rx="20" fill="#0d1526" opacity="0.55"/>
    <circle cx="22" cy="21" r="22" fill="#2e9e4f"/>
    <circle cx="76" cy="21" r="22" fill="#f28c28"/>
    <circle cx="130" cy="21" r="22" fill="#d62828"/>
    <circle cx="184" cy="21" r="22" fill="#111111" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- title -->
  <rect x="190" y="412" width="420" height="114" rx="22" fill="#0d1526" opacity="0.72"/>
  <text x="400" y="470" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">Bison Futé</text>
  <text x="400" y="510" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#e6e9f0">for Gladys Assistant</text>
</svg>
